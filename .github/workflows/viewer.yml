name: Viewer

on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - 'ingest/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/viewer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'viewer/**'
      - 'ingest/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/viewer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # No version pin: action-setup reads it from the root package.json
      # "packageManager" field — the single source shared with the Dockerfile.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm --filter papyri-viewer run check
      - name: Unit tests
        run: pnpm --filter papyri-viewer run test
      - name: Build (no bundles)
        run: pnpm --filter papyri-viewer run build

      # Static snapshot of a real bundle. The link check is what stops the
      # URLs templates emit and the URLs `lib/static-paths.ts` enumerates from
      # drifting apart: a link to a page nothing enumerated fails here.
      - name: Static build + link check
        env:
          PAPYRI_INGEST_DIR: ${{ runner.temp }}/papyri-ingest
        run: |
          pnpm --filter papyri-viewer run seed-store
          pnpm --filter papyri-viewer run build:static
          pnpm --filter papyri-viewer run check:static-links

  check-docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: viewer/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
